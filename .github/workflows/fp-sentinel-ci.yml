name: fp-sentinel-ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev,preprocess]"
          pip install ruff pytest-cov

      - name: Lint (ruff)
        run: ruff check fp_sentinel/ --select E,F,W --ignore E501

      - name: Unit tests with coverage
        run: |
          mkdir -p artifacts
          python -m pytest tests/unit \
            --junitxml=artifacts/unit-tests.xml \
            --cov=fp_sentinel \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-fail-under=59

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: warn

      - name: Playground validation
        run: python scripts/validate_playground.py
