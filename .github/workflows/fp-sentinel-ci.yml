name: fp-sentinel-ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Lint (ruff)
        run: ruff check fp_sentinel/ --select E,F,W --ignore E501

      - name: Unit tests with coverage
        run: pytest tests/unit --cov=fp_sentinel --cov-report=term-missing --cov-fail-under=59

      - name: Playground validation
        run: python scripts/validate_playground.py
