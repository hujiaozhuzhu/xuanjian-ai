[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-sentinel"
version = "3.1.0"
description = "玄鉴 XuanJian AI - AI 驱动的代码安全审计与红蓝对抗平台"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "XuanJian AI"},
]
keywords = ["code-audit", "security", "false-positive", "mcp", "ai-pentest", "devops", "privacy", "vulnerability", "red-team", "java", "python", "javascript", "go"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
scanners = [
    "semgrep>=1.0.0",
]
preprocess = [
    "jsbeautifier>=1.15.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.24.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
browser = [
    "playwright>=1.40.0",
    "aiohttp>=3.9.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
benchmark = [
    "psutil>=5.9.0",
]
all = [
    "fp-sentinel[scanners,preprocess,ml,web,dev,browser,benchmark]",
]

[project.scripts]
fp-sentinel = "fp_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["fp_sentinel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "fp_sentinel/notify/cli.py",
    "fp_sentinel/devops/cli.py",
    "fp_sentinel/devops/routes.py",
    "fp_sentinel/devops/__init__.py",
    "fp_sentinel/privacy/cli_commands.py",
    "fp_sentinel/privacy/routes.py",
    "fp_sentinel/auto_pr/cli.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
    "except Exception",
    "except httpx",
    "logger.warning",
    "logger.exception",
]
